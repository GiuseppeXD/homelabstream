<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Legendas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #334155;
            margin-bottom: 30px;
        }
        header h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 5px; }
        header p { color: #94a3b8; font-size: 0.9rem; }
        .last-update { color: #64748b; font-size: 0.8rem; margin-top: 5px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            transition: border-color 0.3s;
        }
        .card:hover { border-color: #475569; }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }
        .card-header h2 { font-size: 1.1rem; color: #f1f5f9; }
        .card-header .icon { font-size: 1.5rem; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-running { background: #166534; color: #4ade80; }
        .status-stopped { background: #7f1d1d; color: #f87171; }
        .status-processing { background: #854d0e; color: #fbbf24; }
        .status-idle { background: #1e40af; color: #60a5fa; }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        .metric:last-child { border-bottom: none; }
        .metric-label { color: #94a3b8; font-size: 0.9rem; }
        .metric-value { color: #e2e8f0; font-weight: 500; font-family: monospace; }

        .srt-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .srt-table th {
            text-align: left;
            padding: 10px;
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 2px solid #334155;
        }
        .srt-table td {
            padding: 10px;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }
        .srt-table tr:hover { background: #334155; }
        .srt-table .filename {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .activity-log {
            background: #0f172a;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 150px;
            overflow-y: auto;
        }
        .activity-log .log-line {
            padding: 2px 0;
            color: #94a3b8;
            border-bottom: 1px solid #1e293b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background: #38bdf8;
            border-radius: 3px;
            transition: width 0.5s;
        }

        .btn {
            padding: 4px 12px;
            border-radius: 6px;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }
        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            background: #334155;
            color: #cbd5e1;
            font-size: 0.75rem;
            white-space: nowrap;
        }
        .error-box {
            background: #450a0a;
            border: 1px solid #7f1d1d;
            color: #fecaca;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Monitor de Legendas</h1>
            <p>Pipeline: Whisper + Ollama + Bazarr</p>
            <div class="last-update" id="last-update">Carregando...</div>
        </header>

        <div class="grid" id="containers-grid">
            <div class="card">
                <div class="loading"><div class="spinner"></div>Carregando...</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 30px;">
            <div class="card-header">
                <span class="icon">🎯</span>
                <h2>Arquivo em Processamento</h2>
            </div>
            <div id="processing-content">
                <div class="loading"><div class="spinner"></div>Verificando...</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 30px;">
            <div class="card-header">
                <span class="icon">🔄</span>
                <h2>Fila de Tradução</h2>
            </div>
            <div id="translate-queue-content">
                <div class="loading"><div class="spinner"></div>Carregando fila...</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 30px;">
            <div class="card-header">
                <span class="icon">🧩</span>
                <h2>Candidatos Para Tradução</h2>
            </div>
            <div id="candidate-content">
                <div class="loading"><div class="spinner"></div>Procurando legendas aproveitáveis...</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 30px;">
            <div class="card-header">
                <span class="icon">📁</span>
                <h2>Legendas Recentes (últimas 48h)</h2>
            </div>
            <div id="srt-content">
                <div class="loading"><div class="spinner"></div>Carregando arquivos...</div>
            </div>
        </div>
    </div>

    <script>
        const REFRESH_INTERVAL = {{ refresh_interval }} * 1000;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function encodeJob(job) {
            return encodeURIComponent(JSON.stringify(job));
        }

        function filenameFromJob(job) {
            if (!job) return '-';
            return job.filename || (job.source || job.path || '').split('/').pop();
        }

        function getStatusBadge(status, processing) {
            if (status.includes('Up')) {
                if (processing === 'processing') {
                    return '<span class="status-badge status-processing">Processando</span>';
                }
                return '<span class="status-badge status-running">Rodando</span>';
            }
            return '<span class="status-badge status-stopped">Parado</span>';
        }

        function renderContainers(data) {
            const grid = document.getElementById('containers-grid');
            
            const whisperStatus = getStatusBadge(data.whisper.status, data.whisper.processing);
            const ollamaStatus = getStatusBadge(data.ollama.status, data.ollama.processing);
            const bazarrStatus = getStatusBadge(data.bazarr.status, 'idle');

            grid.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <span class="icon">🎙️</span>
                        <h2>Whisper-ASR</h2>
                        ${whisperStatus}
                    </div>
                    <div class="metric">
                        <span class="metric-label">CPU</span>
                        <span class="metric-value">${data.whisper.stats.cpu}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Memória</span>
                        <span class="metric-value">${data.whisper.stats.mem_usage}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Status</span>
                        <span class="metric-value">${data.whisper.processing === 'processing' ? '🔄 Transcrevendo áudio...' : '⏳ Ocioso'}</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="icon">🧠</span>
                        <h2>Ollama</h2>
                        ${ollamaStatus}
                    </div>
                    <div class="metric">
                        <span class="metric-label">CPU</span>
                        <span class="metric-value">${data.ollama.stats.cpu}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Memória</span>
                        <span class="metric-value">${data.ollama.stats.mem_usage}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Modelo</span>
                        <span class="metric-value">${data.ollama.models[0] || 'N/A'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Status</span>
                        <span class="metric-value">${data.ollama.processing === 'processing' ? '🔄 Traduzindo...' : '⏳ Ocioso'}</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="icon">📊</span>
                        <h2>Bazarr</h2>
                        ${bazarrStatus}
                    </div>
                    <div class="metric">
                        <span class="metric-label">CPU</span>
                        <span class="metric-value">${data.bazarr.stats.cpu}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Memória</span>
                        <span class="metric-value">${data.bazarr.stats.mem_usage}</span>
                    </div>
                    <div style="margin-top: 10px;">
                        <span class="metric-label">Atividade recente:</span>
                        <div class="activity-log">
                            ${data.bazarr.activity.map(line => `<div class="log-line">${line.substring(0, 120)}</div>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProcessing(processing) {
            const container = document.getElementById('processing-content');
            
            if (!processing) {
                container.innerHTML = '<p style="color: #64748b; text-align: center;">Nenhum arquivo em processamento no momento</p>';
                return;
            }
            
            let html = '';
            
            if (processing.whisper) {
                html += `
                    <div class="metric">
                        <span class="metric-label">🎙️ Whisper</span>
                        <span class="metric-value">${processing.whisper}</span>
                    </div>
                `;
            }
            
            if (processing.ollama) {
                html += `
                    <div class="metric">
                        <span class="metric-label">🧠 Ollama</span>
                        <span class="metric-value">${processing.ollama}</span>
                    </div>
                `;
            }
            
            if (!processing.whisper && !processing.ollama) {
                html = '<p style="color: #64748b; text-align: center;">Nenhum arquivo em processamento no momento</p>';
            }
            
            container.innerHTML = html;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return m > 0 ? `${m}m ${s}s` : `${s}s`;
        }

        function renderTranslationQueue(data) {
            const container = document.getElementById('translate-queue-content');
            const translation = data.translation || {};
            const current = translation.current;
            const pending = translation.pending || [];
            const completed = translation.completed || [];
            
            let html = '<table class="srt-table">';
            html += '<thead><tr><th>Arquivo</th><th>Status</th><th>Tempo</th><th>Ação</th></tr></thead><tbody>';
            
            if (current) {
                html += `<tr>
                    <td class="filename" title="${escapeHtml(current.source)}">${escapeHtml(filenameFromJob(current))}</td>
                    <td>🔄 Rodando <span class="pill">${escapeHtml(current.language || 'unknown')}</span></td>
                    <td>${formatTime(current.elapsed)}</td>
                    <td><button class="btn btn-danger" onclick="cancelTranslation()">Cancelar</button></td>
                </tr>`;
            }

            pending.forEach(job => {
                html += `<tr>
                    <td class="filename" title="${escapeHtml(job.source || job.path)}">${escapeHtml(filenameFromJob(job))}</td>
                    <td>⏳ Pendente <span class="pill">${escapeHtml(job.language || 'unknown')}</span></td>
                    <td>-</td>
                    <td><button class="btn btn-primary" data-translate-job="${encodeJob(job)}">Traduzir agora</button></td>
                </tr>`;
            });
            
            if (!current && pending.length === 0) {
                html += `<tr><td colspan="4" style="text-align:center;color:#64748b;">Fila vazia</td></tr>`;
            }
            
            html += '</tbody></table>';
            
            if (completed.length > 0) {
                html += '<div style="margin-top: 15px; color: #64748b; font-size: 0.8rem;">';
                html += `Últimos concluídos: ${completed.slice(-3).map(c => escapeHtml(filenameFromJob(c))).join(', ')}`;
                html += '</div>';
            }
            
            container.innerHTML = html;
        }

        function renderCandidates(payload) {
            const container = document.getElementById('candidate-content');
            const candidates = (payload && payload.items) || [];
            const error = payload && payload.error;

            if (error) {
                container.innerHTML = `<div class="error-box">Erro no scanner: ${escapeHtml(error)}</div>`;
                return;
            }

            if (!candidates.length) {
                container.innerHTML = '<p style="color: #64748b; text-align: center;">Nenhum candidato pendente. PT-BR já existe ou o Bazarr ainda não gerou/encontrou legenda aproveitável.</p>';
                return;
            }

            const rows = candidates.slice(0, 20).map(job => `
                <tr>
                    <td><span class="pill">${escapeHtml(job.source_type)}</span></td>
                    <td><span class="pill">${escapeHtml(job.language || 'unknown')}</span></td>
                    <td class="filename" title="${escapeHtml(job.source)}">${escapeHtml(filenameFromJob(job))}</td>
                    <td>${escapeHtml(job.reason || '-')}</td>
                    <td><button class="btn btn-primary" data-translate-job="${encodeJob(job)}">Traduzir</button></td>
                </tr>
            `).join('');

            container.innerHTML = `
                <table class="srt-table">
                    <thead><tr><th>Origem</th><th>Idioma</th><th>Arquivo</th><th>Motivo</th><th>Ação</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function renderSrtFiles(files) {
            const container = document.getElementById('srt-content');
            
            if (!files || files.length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center;">Nenhuma legenda gerada recentemente</p>';
                return;
            }

            const rows = files.map(f => `
                <tr>
                    <td>${escapeHtml(f.flag)}</td>
                    <td class="filename" title="${escapeHtml(f.path)}">${escapeHtml(f.filename)}</td>
                    <td>${escapeHtml(f.size)}</td>
                    <td>${escapeHtml(f.ago)}</td>
                    <td style="color: #64748b; font-size: 0.8rem;">${escapeHtml(f.timestamp)}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <table class="srt-table">
                    <thead>
                        <tr>
                            <th>Idioma</th>
                            <th>Arquivo</th>
                            <th>Tamanho</th>
                            <th>Tempo</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        async function cancelTranslation() {
            try {
                await fetch('/api/translate/cancel', {method: 'POST'});
                fetchStatus();
            } catch (e) {
                console.error('Cancel failed:', e);
            }
        }

        async function triggerTranslation(path, job) {
            try {
                await fetch('/api/translate/trigger', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(job ? {job} : {path})
                });
                fetchStatus();
            } catch (e) {
                console.error('Trigger failed:', e);
            }
        }

        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                renderContainers(data);
                renderProcessing(data.current_processing);
                renderTranslationQueue(data);
                renderCandidates(data.candidates);
                renderSrtFiles(data.srt_files);
                
                document.getElementById('last-update').textContent = 
                    `Última atualização: ${data.timestamp}`;
            } catch (error) {
                console.error('Error fetching status:', error);
                document.getElementById('last-update').textContent = 
                    'Erro ao atualizar - tentando novamente...';
                ['containers-grid', 'processing-content', 'translate-queue-content', 'candidate-content', 'srt-content'].forEach(id => {
                    const element = document.getElementById(id);
                    if (element && element.textContent.includes('Carregando')) {
                        element.innerHTML = '<div class="error-box">Falha ao carregar dados da API. Veja os logs do legendas-webui.</div>';
                    }
                });
            }
        }

        document.addEventListener('click', event => {
            const button = event.target.closest('[data-translate-job]');
            if (!button) return;
            try {
                const job = JSON.parse(decodeURIComponent(button.dataset.translateJob));
                triggerTranslation(null, job);
            } catch (error) {
                console.error('Invalid translate job:', error);
            }
        });

        // Initial load
        fetchStatus();
        
        // Auto refresh
        setInterval(fetchStatus, REFRESH_INTERVAL);
    </script>
</body>
</html>
