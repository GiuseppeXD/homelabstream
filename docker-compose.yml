services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e # v3.4.6
    container_name: flaresolverr
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    ports:
      - "${FLARESOLVERR_PORT}:8191"
    networks:
      - media_net
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:3679a75dd2304b695525d83a4ff14c458708b5da4a7ce53044240932139590e1 # 5.1.4
    container_name: qbittorrent
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./config/qbittorrent:/config
      - ./media/downloads:/downloads
    networks:
      - media_net
  radarr:
    image: lscr.io/linuxserver/radarr@sha256:cd70546fc97169788530386b42cf47ba1b16d091b4dc2264cd54099dd13c6f7f # 6.1.1.10360-ls298
    container_name: radarr
    mem_limit: 768m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - ./config/radarr:/config
      - ./media:/media
    networks:
      - media_net
  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:76414c033f290d3c9f1f9dfad71150abe71d92592369a3377a5903d579e6e2b2 # 4.0.17.2952-ls305
    container_name: sonarr
    mem_limit: 768m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${SONARR_PORT}:8989"
    volumes:
      - ./config/sonarr:/config
      - ./media:/media
    networks:
      - media_net
  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:9ef5d8bf832edcacb6082f9262cb36087854e78eb7b1c3e1d4375056055b2d82 # 2.3.0.5236-ls139
    container_name: prowlarr
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    networks:
      - media_net
  bazarr:
    # NOTA: post-processing script configurado mas provavelmente não funciona
    # para legendas geradas pelo Whisper. O pipeline automático EN->PT-BR
    # agora é gerenciado pelo legendas-webui (watchdog + fila).
    # Deixado aqui como fallback caso seja útil no futuro.
    image: lscr.io/linuxserver/bazarr@sha256:cb57afc3bd35558e1e7062658f9d4d18a0b4c474f10afe55f0ccfd867025f24f # 1.5.6
    container_name: bazarr
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${BAZARR_PORT}:6767"
    volumes:
      - ./config/bazarr:/config
      - ./media:/media
    networks:
      - media_net
  jellyfin:
    image: lscr.io/linuxserver/jellyfin@sha256:7351868a3a340049503d25da65fae19c77ce3ea58f607f702cac65b6faeec898 # 10.11.8
    container_name: jellyfin
    mem_limit: 6g
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
    volumes:
      - ./config/jellyfin:/config
      - ./media:/media
    networks:
      - media_net
  jellyseerr:
    image: ghcr.io/seerr-team/seerr@sha256:c4cbd5121236ac2f70a843a0b920b68a27976be57917555f1c45b08a1e6b2aad # v3.2.0
    init: true
    container_name: jellyseerr
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    ports:
      - "${JELLYSEERR_PORT}:5055"
    volumes:
      - ./config/jellyseerr:/app/config
    networks:
      - media_net

  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice@sha256:03b402335881cdab2e4939b24620809df8d6ceec3bf2712217d41c8761a0f5d4 # v1.9.1
    container_name: whisper-asr
    profiles:
      - transcription
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - ASR_ENGINE=${WHISPER_ENGINE:-whisper}
      - ASR_MODEL=${WHISPER_MODEL:-large-v3}
      - ASR_DEVICE=${WHISPER_DEVICE:-cpu}
      - OMP_NUM_THREADS=${WHISPER_CPU_THREADS:-12}
    volumes:
      - ./config/whisper/cache:/root/.cache
    ports:
      - "${WHISPER_PORT}:9000"
    networks:
      - media_net
    deploy:
      resources:
        limits:
          cpus: '12.0'
          memory: ${WHISPER_MEMORY:-8G}
          pids: 200

  ollama:
    image: ollama/ollama@sha256:3ca37ec2b9cb6341b62554074205c616778fe98abcf9e4fc50361b79a07407ae # v0.22.1
    container_name: ollama
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    networks:
      - media_net
    deploy:
      resources:
        limits:
          cpus: '12.0'
          memory: ${OLLAMA_MEMORY:-8G}
          pids: 200

  legendas-webui:
    build:
      context: ./scripts/webui-legendas
      dockerfile: Dockerfile
    container_name: legendas-webui
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    group_add:
      - "968"  # host docker group GID for /var/run/docker.sock access
    ports:
      - "8990:8989"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./media:/media:rw
      - ./config/bazarr/log:/bazarr-logs:ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - MEDIA_DIR=/media
      - BAZARR_LOG_DIR=/bazarr-logs
      - REFRESH_INTERVAL=15
      - TRANSLATE_MODEL=${TRANSLATE_MODEL:-gemma3:4b}
      - OLLAMA_URL=http://ollama:11434/api/generate
      - BATCH_SIZE=40
      - NUM_PREDICT=2048
      - SUBTITLE_SCAN_INTERVAL=300
      - SUBTITLE_SCAN_MIN_AGE=600
      - SUBTITLE_AUTO_QUEUE_LIMIT=0
    networks:
      - media_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  media_net:
    driver: bridge
