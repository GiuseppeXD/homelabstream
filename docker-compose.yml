services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e # v3.4.6
    container_name: flaresolverr
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    ports:
      - "${FLARESOLVERR_PORT}:8191"
    networks:
      - media_net
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:a68c4cfb7b07c39cf3f13e7f1d23d333c1e4a60304d37bc1eec7af3eacfe12d5 # 5.1.4-r1-ls432
    container_name: qbittorrent
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./config/qbittorrent:/config
      - ./media/downloads:/downloads
    networks:
      - media_net
  radarr:
    image: lscr.io/linuxserver/radarr@sha256:6c0948b42c149e36bb3dbc0b64d36c77b2d3c9dccf1b424c4f72af1e57ba0c21 # 6.0.4.10291-ls289
    container_name: radarr
    mem_limit: 768m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - ./config/radarr:/config
      - ./media:/media
    networks:
      - media_net
  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:8b9f2138ec50fc9e521960868f79d2ad0d529bc610aef19031ea8ff80b54c5e0 # 4.0.16.2944-ls300
    container_name: sonarr
    mem_limit: 768m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${SONARR_PORT}:8989"
    volumes:
      - ./config/sonarr:/config
      - ./media:/media
    networks:
      - media_net
  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:67a8aaedcfd6989f3030b937a6a07007310b1dfc7ee8df16d2cbfa48d1c1158c # 2.3.0.5236-ls134
    container_name: prowlarr
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    networks:
      - media_net
  bazarr:
    image: lscr.io/linuxserver/bazarr@sha256:648f694532a3a53d8cf78bc888919ef538659bad41af4c680b0427ad1047d171 # v1.5.3-ls328
    container_name: bazarr
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${BAZARR_PORT}:6767"
    volumes:
      - ./config/bazarr:/config
      - ./media:/media
    networks:
      - media_net
  jellyfin:
    image: lscr.io/linuxserver/jellyfin@sha256:6e614901a5e9d04f03b2b84363fcc69285635d4149e23e4cac30b1c9a8ccddac # 10.11.5ubu2404-ls13
    container_name: jellyfin
    mem_limit: 6g
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
    volumes:
      - ./config/jellyfin:/config
      - ./media:/media
    networks:
      - media_net
  jellyseerr:
    image: fallenbagel/jellyseerr@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764 # 2.7.3
    container_name: jellyseerr
    mem_limit: 512m
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - TZ=${TZ}
    ports:
      - "${JELLYSEERR_PORT}:5055"
    volumes:
      - ./config/jellyseerr:/app/config
    networks:
      - media_net

  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper-asr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=${WHISPER_MODEL:-large-v3}
      - ASR_DEVICE=${WHISPER_DEVICE:-cpu}
      - OMP_NUM_THREADS=${WHISPER_CPU_THREADS:-12}
    volumes:
      - ./config/whisper/cache:/root/.cache
    ports:
      - "${WHISPER_PORT}:9000"
    networks:
      - media_net
    deploy:
      resources:
        limits:
          cpus: '12.0'
          memory: ${WHISPER_MEMORY:-8G}
          pids: 200

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    networks:
      - media_net
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: ${OLLAMA_MEMORY:-8G}
          pids: 200

  legendas-webui:
    build:
      context: ./scripts/webui-legendas
      dockerfile: Dockerfile
    container_name: legendas-webui
    restart: unless-stopped
    ports:
      - "8990:8989"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./media:/media:ro
      - ./config/bazarr/log:/bazarr-logs:ro
    environment:
      - MEDIA_DIR=/media
      - BAZARR_LOG_DIR=/bazarr-logs
      - REFRESH_INTERVAL=15
    networks:
      - media_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  media_net:
    driver: bridge
